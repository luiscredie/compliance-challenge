<!doctype html><html lang="pt-BR"><head><script src="config.js"></script><script src="assets/cloud.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compliance Detective · LG Compliance Challenge</title><link rel="stylesheet" href="/assets/game.css"><style>
:root{--navy:#071e34;--gold:#d4ad55;--paper:#fff9e8;--ink:#2b241c;--wine:#a50034}.detShell{max-width:1180px;margin:auto;padding:24px}.detHead{display:flex;justify-content:space-between;gap:16px;align-items:center;color:#fff}.detHero{background:radial-gradient(circle at 80% 10%,#244b68,#071e34 55%);min-height:100vh;padding-bottom:50px}.detHead h1{margin:4px 0;font-size:clamp(30px,5vw,54px)}.ghost{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700}.detLayout{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:18px}.panel{background:linear-gradient(150deg,#fffdf5,#f4e5bf);border:1px solid #c99e49;border-radius:18px;padding:18px;box-shadow:0 18px 45px rgba(0,0,0,.2)}.caseList{display:grid;gap:9px}.caseBtn{width:100%;text-align:left;border:1px solid #d6bd84;background:#fffaf0;padding:12px;border-radius:12px}.caseBtn.active{outline:3px solid rgba(165,0,52,.22);border-color:#a50034}.caseBtn small{display:block;color:#6e604c;margin-top:4px}.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:#a50034}.meter{height:9px;background:#dccba7;border-radius:999px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#a50034,#d4ad55)}.evidenceGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.evidence{border:1px solid #d6bd84;border-radius:12px;background:#fffaf0;padding:12px;text-align:left}.evidence.opened{background:#fff;border-color:#a50034}.evidence p{font-size:12px;line-height:1.45;color:#66594a}.evidenceContent{margin-top:8px;padding:10px;background:#f4f0e8;border-radius:8px;font-size:12px;line-height:1.5}.evidenceMedia{display:block;width:100%;margin:9px 0 5px;border-radius:10px;border:1px solid #d7c9ad;max-height:320px;object-fit:cover}.evidenceVisualBtn{display:block;width:100%;border:0;background:transparent;padding:0;cursor:zoom-in}.visualLightbox{position:fixed;inset:0;z-index:1000;background:rgba(3,11,18,.92);display:grid;place-items:center;padding:24px}.visualLightbox.hidden{display:none}.visualLightbox figure{margin:0;max-width:min(1180px,96vw);max-height:92vh}.visualLightbox img{display:block;max-width:100%;max-height:82vh;border-radius:14px;box-shadow:0 20px 70px #000}.visualLightbox figcaption{color:#fff;margin-top:10px;text-align:center}.visualLightbox button{position:fixed;right:22px;top:18px;border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.45);color:#fff;width:44px;height:44px;border-radius:50%;font-size:24px}.conclusions{display:grid;gap:8px}.conclusion{border:1px solid #d6bd84;background:#fff;padding:12px;border-radius:10px;text-align:left}.conclusion.selected{border-color:#a50034;background:#fff0f4}.support{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.support label{border:1px solid #9ab3a8;background:#eef6f3;padding:8px 10px;border-radius:999px;font-size:11px;color:#24463d;font-weight:700}.support input{accent-color:#2f735f}.supportNote{font-size:11px;color:#4f5e58;line-height:1.45;background:#f0f6f3;border-left:4px solid #2f735f;border-radius:8px;padding:10px 12px;margin:8px 0 12px}.primary{border:0;background:#a50034;color:#fff;padding:11px 15px;border-radius:10px;font-weight:800}.primary:disabled{opacity:.45}.result{margin-top:14px;border-left:5px solid #a50034;background:#fff;padding:13px;border-radius:9px}.muted{color:#6e604c}.lock{padding:14px;border:1px dashed #a50034;background:#fff6f8;border-radius:12px}.statusDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-right:5px}.statusDot.done{background:#2f735f}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:850px){.detLayout{grid-template-columns:1fr}.evidenceGrid{grid-template-columns:1fr}.detHead{align-items:flex-start;flex-direction:column}}</style><link rel="stylesheet" href="/assets/achievement-toast.css"><link rel="stylesheet" href="/assets/i18n.css"><script src="/assets/i18n.js"></script><link rel="stylesheet" href="/assets/p0-design-governance.css"><link rel="stylesheet" href="/assets/p1-design-system.css"><link rel="stylesheet" href="/assets/p2-performance.css"><link rel="stylesheet" href="/assets/ui-contrast-alignment-fix.css?v=20260911d"></head><body class="detHero"><main class="detShell"><header class="detHead"><div><div class="tag" style="color:#f0cf76">ATIVIDADE EXTRA · NÃO ALTERA O RANKING</div><h1>Compliance Detective</h1><div style="color:rgba(255,255,255,.75)">Investigue evidências. Construa a conclusão. Não procure apenas a alternativa “certa”.</div></div><button class="ghost" onclick="returnJourney()">← Voltar à Jornada</button></header><div class="detLayout"><aside class="panel"><div class="tag">CASOS</div><h2>Arquivo de investigações</h2><div id="mastery" class="muted"></div><div id="cases" class="caseList" style="margin-top:14px"></div></aside><section class="panel" id="casePanel"><div class="muted">Carregando casos...</div></section></div></main><div id="visualLightbox" class="visualLightbox hidden" role="dialog" aria-modal="true" aria-label="Visualização ampliada"><button type="button" aria-label="Fechar imagem" onclick="closeVisual()">×</button><figure><img id="visualLightboxImg" alt=""><figcaption id="visualLightboxCaption"></figcaption></figure></div><script src="/assets/achievement-toast.js"></script><script>
const token=sessionStorage.getItem('lgpt');if(!token)location.href='/';function returnJourney(){sessionStorage.setItem('lgInternalReturn','1');location.href='/'}const H=()=>({'Authorization':'Bearer '+token});async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...H(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){const msg=d.detail||'Erro';throw new Error(window.LGCI18N?LGCI18N.translate(msg):msg)}return d}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function shuffleChoices(items){const a=[...(items||[])];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let catalog=null,current=null,chosenConclusion=null,chosenEvidence=new Set();function openVisual(src,alt,caption){const m=document.getElementById('visualLightbox');document.getElementById('visualLightboxImg').src=src;document.getElementById('visualLightboxImg').alt=alt||'';document.getElementById('visualLightboxCaption').textContent=caption||'';m.classList.remove('hidden')}function closeVisual(){document.getElementById('visualLightbox').classList.add('hidden')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVisual()});
async function init(){catalog=await api('/api/detective');renderCatalog();if(catalog.open===false){document.getElementById('casePanel').innerHTML='<div class="lock"><strong>Compliance Detective temporariamente fechado.</strong><br>O Admin ainda não abriu esta atividade extra.</div>';return}if(!catalog.unlocked){document.getElementById('casePanel').innerHTML='<div class="lock"><strong>Compliance Detective ainda bloqueado.</strong><br>Conclua a Etapa 1 para liberar os casos de investigação.</div>';return}if(catalog.cases.length)openCase(catalog.cases[0].id)}
function renderCatalog(){document.getElementById('mastery').textContent=`${catalog.mastery.mastered}/${catalog.mastery.total} casos dominados`;document.getElementById('cases').innerHTML=catalog.cases.map(c=>`<button class="caseBtn ${current===c.id?'active':''}" onclick="openCase('${esc(c.id)}')"><strong><span class="statusDot ${c.status==='completed'?'done':''}"></span>${esc(c.title)}</strong><small>${esc(c.subtitle)} · ${esc(c.difficulty)} · ${esc(c.estimated)}</small>${c.performance!=null?`<small>Resultado anterior: ${Math.round(c.performance*100)}%</small>`:''}</button>`).join('')}
async function openCase(id){current=id;chosenConclusion=null;chosenEvidence=new Set();const d=await api('/api/detective/'+encodeURIComponent(id));if(d.state.status==='not_started')await startCase(id);else renderCase(d);renderCatalog()}
async function startCase(id){const d=await api('/api/detective/'+encodeURIComponent(id)+'/start',{method:'POST'});renderCase(d)}
function nextCaseId(id){const rows=catalog?.cases||[],i=rows.findIndex(x=>x.id===id);return i>=0&&i<rows.length-1?rows[i+1].id:null}
function completedCaseActions(s){const next=nextCaseId(current);if(s.correct_conclusion&&next)return `<button class="primary" onclick="openCase('${esc(next)}')">AVANÇAR PARA O PRÓXIMO CASO →</button><button class="secondary" onclick="restartCase()">REFAZER CASO</button>`;if(s.correct_conclusion)return `<button class="primary" onclick="returnJourney()">CONCLUIR INVESTIGAÇÃO →</button><button class="secondary" onclick="restartCase()">REFAZER CASO</button>`;return `<button class="primary" onclick="restartCase()">TENTAR NOVAMENTE</button>`}
function renderCase(d){const c=d.case,s=d.state;const done=s.status==='completed';document.getElementById('casePanel').innerHTML=`<div class="tag">${esc(c.subtitle)}</div><h2>${esc(c.title)}</h2><p class="muted">${esc(c.briefing)}</p><div><strong>Ações de investigação</strong> · ${s.actions_left}/${s.action_budget}<div class="meter"><span style="width:${100*s.actions_left/Math.max(1,s.action_budget)}%"></span></div></div><h3>Evidências</h3><div class="evidenceGrid">${d.evidence.map(e=>`<button class="evidence ${e.opened?'opened':''}" ${done||e.opened?'':'onclick="investigate(\''+esc(e.id)+'\')"'}><strong>${esc(e.label)}</strong><p>${esc(e.type)} · ${esc(e.preview)}</p>${e.opened?`${e.asset?`<span class="evidenceVisualBtn" role="button" tabindex="0" onclick="event.stopPropagation();openVisual('${esc(e.asset)}','${esc(e.asset_alt||e.label)}','${esc(e.label)}')"><img class="evidenceMedia" src="${esc(e.asset)}" alt="${esc(e.asset_alt||e.label)}"></span>`:''}<div class="evidenceContent">${esc(e.content)}</div>`:`<small>${s.actions_left>0?'INVESTIGAR · custa 1 ação':'SEM AÇÕES RESTANTES'}</small>`}</button>`).join('')}</div>${done?`<div class="result"><strong>Caso concluído · ${Math.round((s.performance||0)*100)}%</strong><br>${s.correct_conclusion?'Conclusão registrada. Continue para o próximo caso.':'Revise a conclusão e tente novamente.'}</div><div class="actions">${completedCaseActions(s)}</div>`:renderSolve(c,d.evidence)}`}
function renderSolve(c,evidence){const opened=evidence.filter(e=>e.opened);chosenEvidence=new Set(opened.map(e=>e.id));return `<h3>Sua conclusão</h3><div class="conclusions">${shuffleChoices(c.conclusions).map(o=>`<button class="conclusion" data-conclusion="${esc(o.id)}" onclick="chooseConclusion('${esc(o.id)}',this)">${esc(o.text)}</button>`).join('')}</div><h3>Evidências consultadas na sua investigação</h3><div class="supportNote">Esta lista registra automaticamente o que você abriu durante o caso. Consultar uma evidência não significa necessariamente que ela sustenta a melhor conclusão.</div><div class="support">${opened.map(e=>`<label><input type="checkbox" checked disabled aria-label="Evidência utilizada"> ✓ ${esc(e.label)}</label>`).join('')||'<span class="muted">Investigue pelo menos uma evidência antes de concluir.</span>'}</div><div class="actions"><button id="solveBtn" class="primary" disabled onclick="solveCase()">REGISTRAR CONCLUSÃO</button></div><div id="solveResult"></div>`}
function chooseConclusion(id,el){chosenConclusion=id;document.querySelectorAll('.conclusion').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');ready()}function ready(){const b=document.getElementById('solveBtn');if(b)b.disabled=!chosenConclusion||chosenEvidence.size===0}
async function investigate(id){try{await api('/api/detective/'+encodeURIComponent(current)+'/investigate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({evidence_id:id})});const d=await api('/api/detective/'+encodeURIComponent(current));renderCase(d)}catch(e){alert(e.message)}}
async function solveCase(){try{const d=await api('/api/detective/'+encodeURIComponent(current)+'/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conclusion:chosenConclusion,evidence:[...chosenEvidence]})});catalog=await api('/api/detective');renderCatalog();const next=nextCaseId(current),cta=d.correct_conclusion?(next?`<button class="primary" onclick="openCase('${esc(next)}')">AVANÇAR PARA O PRÓXIMO CASO →</button>`:`<button class="primary" onclick="returnJourney()">CONCLUIR INVESTIGAÇÃO →</button>`):`<button class="primary" onclick="restartCase()">TENTAR NOVAMENTE</button>`;document.getElementById('solveResult').innerHTML=`<div class="result"><strong>${Math.round(d.performance*100)}% de consistência</strong><br>${esc(d.feedback.explain)}<br><br><strong>Evidências-chave para a melhor conclusão:</strong> ${(d.key_evidence||[]).map(esc).join(' · ')||'—'}<br><br><strong>Melhor prática:</strong> ${esc(d.feedback.best)}<br><small class="muted">${esc(d.note)}</small></div><div class="actions">${cta}</div>`;if(window.LGCAchievement)LGCAchievement.show(d.achievements_unlocked||[])}catch(e){alert(e.message)}}
async function restartCase(){await api('/api/detective/'+encodeURIComponent(current)+'/restart',{method:'POST'});const d=await api('/api/detective/'+encodeURIComponent(current));chosenConclusion=null;chosenEvidence=new Set();renderCase(d);catalog=await api('/api/detective');renderCatalog()}init().catch(e=>document.getElementById('casePanel').innerHTML=`<div class="lock">${esc(e.message)}</div>`);
</script><script src="/assets/p0-design-governance.js" defer></script><script src="/assets/p1-editorial-normalization.js" defer></script><script src="/assets/p2-performance.js" defer></script><script src="/assets/ui-contrast-alignment-fix.js?v=20260911d" defer></script></body></html>
