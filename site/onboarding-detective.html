<!doctype html><html lang="pt-BR"><head><script src="config.js"></script><script src="assets/cloud.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Detetive · LG Compliance Challenge</title><link rel="stylesheet" href="/assets/achievement-toast.css"><link rel="stylesheet" href="/assets/i18n.css"><style>:root{--navy:#071e34;--wine:#a50034;--gold:#e0bb62;--paper:#fffaf0;--ink:#2e2924;--line:#d9cdbb;--green:#2f735f}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#234a67,#071e34 58%);color:#fff}.shell{max-width:1040px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center}.ghost{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:10px;padding:10px 13px;font-weight:700}.eyebrow{font-size:10px;letter-spacing:.13em;font-weight:900;color:#f0ca6e}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;margin-top:18px}.card{background:linear-gradient(145deg,#fffdf5,#f4e4bc);color:var(--ink);border:1px solid #caa34d;border-radius:17px;padding:18px;box-shadow:0 18px 42px rgba(0,0,0,.2)}.evidence{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;margin:8px 0;color:var(--ink)}.evidence.opened{border-color:var(--green);background:#f2fbf6}.evidence strong{display:block}.evidence small{display:block;color:#746a5d;margin-top:4px}.content{margin-top:7px;padding:9px;background:#f8f4ed;border-radius:8px;font-size:12px;line-height:1.5}.evidenceMedia{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:8px;margin:8px 0;border:1px solid #d9cdbb}.visualLightbox{position:fixed;inset:0;z-index:1000;background:rgba(3,11,18,.92);display:grid;place-items:center;padding:24px}.visualLightbox.hidden{display:none}.visualLightbox figure{margin:0;max-width:min(1100px,96vw)}.visualLightbox img{max-width:100%;max-height:82vh;border-radius:14px}.visualLightbox figcaption{color:#fff;text-align:center;margin-top:8px}.visualLightbox button{position:fixed;right:20px;top:18px;width:44px;height:44px;border-radius:50%;border:1px solid #fff8;background:#0008;color:#fff;font-size:23px}.choice{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin:8px 0}.choice:hover{border-color:var(--wine)}.primary{border:0;background:var(--wine);color:#fff;border-radius:10px;padding:11px 15px;font-weight:800}.primary:disabled{opacity:.5}.result{padding:13px;border-left:5px solid var(--green);background:#fff;border-radius:9px;margin-top:14px;line-height:1.5}.muted{color:#71675b;font-size:12px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.shell{padding:16px}}</style><script src="/assets/i18n.js"></script><link rel="stylesheet" href="/assets/p0-design-governance.css"><link rel="stylesheet" href="/assets/p1-design-system.css"><link rel="stylesheet" href="/assets/p2-performance.css"><link rel="stylesheet" href="/assets/ui-contrast-alignment-fix.css?v=20260911d"><link rel="stylesheet" href="assets/visual-review.css"><script src="assets/visual-review.js" defer></script></head><body><main class="shell"><header class="head"><div><div class="eyebrow" data-i18n="onboarding.label">AMBIENTAÇÃO</div><h1 data-i18n="onboarding.detective.title">Mini Detetive</h1><p style="color:rgba(255,255,255,.75);margin:0" data-i18n="onboarding.detective.subtitle">Aprenda a investigar antes da abertura da Etapa 1.</p></div><button class="ghost" onclick="returnJourney()">← Jornada</button></header><div class="layout"><aside class="card"><h2 id="caseTitle">Carregando…</h2><p id="briefing" class="muted"></p><div id="budget" class="muted"></div><div id="evidence"></div></aside><section class="card"><div class="eyebrow">DECISÃO</div><h2 id="decisionTitle">Investigue antes de concluir</h2><p class="muted">Abra evidências relevantes e escolha a melhor conclusão. Esta atividade não altera o ranking oficial.</p><div id="conclusions"></div><div id="result"></div></section></div></main><div id="visualLightbox" class="visualLightbox hidden" role="dialog" aria-modal="true"><button aria-label="Fechar imagem" onclick="closeVisual()">×</button><figure><img id="visualLightboxImg" alt=""><figcaption id="visualLightboxCaption"></figcaption></figure></div><script src="/assets/achievement-toast.js"></script><script>
const token=sessionStorage.getItem('lgpt');if(!token)location.href='/';function returnJourney(){sessionStorage.setItem('lgInternalReturn','1');location.href='/'}const H=()=>({'Authorization':'Bearer '+token});function openVisual(src,alt,caption){const m=document.getElementById('visualLightbox');document.getElementById('visualLightboxImg').src=src;document.getElementById('visualLightboxImg').alt=alt||'';document.getElementById('visualLightboxCaption').textContent=caption||'';m.classList.remove('hidden')}function closeVisual(){document.getElementById('visualLightbox').classList.add('hidden')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeVisual()});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...H(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||'Erro');return d}let state=null;async function load(){state=await api('/api/onboarding-detective');render()}function render(){const c=state.case||{},st=state.state||{};document.getElementById('caseTitle').textContent=c.title||'Mini Detetive';document.getElementById('briefing').textContent=c.briefing||'';document.getElementById('budget').textContent=`Ações de investigação disponíveis: ${st.actions_left??0}`;document.getElementById('evidence').innerHTML=(state.evidence||[]).map(e=>`<button class="evidence ${e.opened?'opened':''}" onclick="investigate('${esc(e.id)}')"><strong>${esc(e.label)}</strong><small>${esc(e.preview||'')}</small>${e.opened?`${e.asset?`<span role="button" tabindex="0" onclick="event.stopPropagation();openVisual('${esc(e.asset)}','${esc(e.asset_alt||e.label)}','${esc(e.label)}')"><img class="evidenceMedia" src="${esc(e.asset)}" alt="${esc(e.asset_alt||e.label)}"></span>`:''}<div class="content">${esc(e.content||'')}</div>`:''}</button>`).join('');const done=st.status==='completed';document.getElementById('conclusions').innerHTML=done?'':(c.conclusions||[]).map(x=>`<button class="choice" onclick="solve('${esc(x.id)}')"><strong>${esc(x.label||x.id)}</strong>${x.text?`<div class="muted">${esc(x.text)}</div>`:''}</button>`).join('');if(done){const ok=!!st.correct_conclusion,cov=Math.round(Number(st.coverage||0)*100);document.getElementById('result').innerHTML=`<div class="result"><strong>${ok&&cov===100?'✓ Investigação concluída':'Investigação concluída'}</strong><br>${ok?'Sua conclusão está correta.':'Revise as evidências e tente novamente para concluir a investigação.'}<br>Cobertura das evidências-chave: ${cov}%</div><div class="actions"><button class="primary" onclick="returnJourney()">VOLTAR À JORNADA</button>${ok&&cov===100?'':`<button class="ghost" style="color:#2e2924;border-color:#b9aa96" onclick="restart()">TENTAR NOVAMENTE</button>`}</div>`}else document.getElementById('result').innerHTML=''}async function investigate(id){try{state=await api('/api/onboarding-detective/investigate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({evidence_id:id})});render()}catch(e){alert(e.message)}}async function solve(id){try{const d=await api('/api/onboarding-detective/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conclusion:id})});state=await api('/api/onboarding-detective');render();if(window.LGCAchievement){const items=(d.achievements_unlocked&&d.achievements_unlocked.length)?d.achievements_unlocked:(d.achievement_feedback?[d.achievement_feedback]:[]);LGCAchievement.show(items)}}catch(e){alert(e.message)}}async function restart(){await api('/api/onboarding-detective/restart',{method:'POST'});await load()}load().catch(e=>document.getElementById('result').innerHTML=`<div class="result">${esc(e.message)}</div>`);
</script><script src="/assets/p0-design-governance.js" defer></script><script src="/assets/p1-editorial-normalization.js" defer></script><script src="/assets/p2-performance.js" defer></script><script src="/assets/ui-contrast-alignment-fix.js?v=20260911d" defer></script></body></html>
