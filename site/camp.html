</style><link rel="stylesheet" href="/assets/achievement-toast.css"><link rel="stylesheet" href="/assets/i18n.css"><script src="/assets/i18n.js"></script><link rel="stylesheet" href="/assets/visual-fixes-round2.css"><link rel="stylesheet" href="/assets/visual-fixes-round3.css"><link rel="stylesheet" href="/assets/design-system.css"><link rel="stylesheet" href="/assets/ui-contrast-alignment-fix.css?v=20260911d"><link rel="stylesheet" href="/assets/consolidated-stage1-camp-fix.css?v=20260915b"><link rel="stylesheet" href="assets/visual-review.css"><script src="assets/visual-review.js" defer></script><link rel="stylesheet" href="assets/accessibility.css?v=20260923a"></head><body><main class="shell"><header class="head"><div><div class="brandMini"><div class="brandMark" title="LG Compliance Day"><img src="/assets/compliance-day-emblem.webp" alt="Emblema LG Compliance Day 2026"></div><div><small style="color:#f2cf72;font-weight:800" data-i18n="roulette.kicker">COMPLIANCE CHALLENGE · ROLETA</small><h1 id="title">Roleta do Acampamento</h1></div></div><div id="rouletteLead" style="color:rgba(255,255,255,.75);margin-top:7px">Gire, responda e treine decisões rápidas.</div></div><button class="ghost" onclick="returnJourney()">← Jornada</button></header><div class="switches"><button class="ghost" data-i18n="onboarding.roulette.short" onclick="goCamp(0)">Boas-vindas</button><button id="campTab1" class="ghost campTab" data-camp="1" onclick="goCamp(1)">Acampamento 1</button><button id="campTab2" class="ghost campTab" data-camp="2" onclick="goCamp(2)">Acampamento 2</button></div><div class="layout"><section class="card wheelWrap"><div class="wheelStage"><div id="wheel" class="wheel" aria-hidden="true"></div><div class="wheelPointer" aria-hidden="true"></div><div class="wheelCenter"><img src="/assets/compliance-day-emblem.webp" alt="Emblema LG Compliance Day 2026"></div></div><button id="spinBtn" class="primary" onclick="spin()">GIRAR A ROLETA</button></section><section class="card"><div id="summary"></div><div id="challenge" role="status" aria-live="polite" aria-atomic="true" style="margin-top:16px"></div></section></div></main><script src="/assets/achievement-toast.js"></script><script>
const token=sessionStorage.getItem('lgpt');if(!token)location.href='/';function returnJourney(){sessionStorage.setItem('lgInternalReturn','1');location.href='/'}const qs=new URLSearchParams(location.search);let camp=Number(qs.get('camp')||0);if(![0,1,2].includes(camp))camp=0;function shuffleChoices(items){const a=[...(items||[])];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}let spinId=null,rotation=0,rankingVisible=false;const H=()=>({'Authorization':'Bearer '+token});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...H(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){const msg=d.detail||'Erro';throw new Error(window.LGCI18N?LGCI18N.translate(msg):msg)}return d}function goCamp(n){
 const tab=document.querySelector('.campTab[data-camp="'+n+'"]');
 if(tab&&tab.disabled)return false;
 location.href='/camp.html?camp='+n;
}
async function load(){
 let catalog=null;
 try{catalog=await api('/api/camps')}catch(e){}
 const camps=Array.isArray(catalog?.camps)?catalog.camps:[];
 [1,2].forEach(n=>{
  const tab=document.getElementById('campTab'+n);
  const state=camps.find(x=>Number(x.camp)===n);
  if(!tab)return;
  const unlocked=Boolean(state?.unlocked);
  tab.disabled=!unlocked;
  tab.setAttribute('aria-disabled',String(!unlocked));
  tab.title=unlocked?'':('Conclua a Etapa '+n+' para liberar.');
 });
 const d=await api('/api/camps/'+camp);document.getElementById('title').textContent=d.title;document.getElementById('rouletteLead').textContent=camp===0?(window.LGCI18N?LGCI18N.t('onboarding.roulette.pagelead',{},'Gire, responda e descubra como a dinâmica funciona.'):'Gire, responda e descubra como a dinâmica funciona.'):'Gire, responda e conquiste badges extras sem alterar o ranking.';renderSummary(d);if(d.open===false){document.getElementById('challenge').innerHTML='<div class="lock"><strong>Roleta temporariamente fechada.</strong><br>O Admin ainda não abriu esta atividade extra.</div>';document.getElementById('spinBtn').disabled=true}else if(!d.unlocked){document.getElementById('challenge').innerHTML=`<div class="lock"><strong>Acampamento bloqueado.</strong><br>Conclua a Etapa ${camp} para liberar a roleta.</div>`;document.getElementById('spinBtn').disabled=true}else if(d.active){spin(false)}else document.getElementById('challenge').innerHTML='<div class="muted">Gire a roleta para receber um desafio rápido.</div>'}
function renderSummary(s){window.__lastCampSummary=s;const need=Number(s.achievement?.correct_required||0),progress=need?Math.min(100,Math.round(Number(s.correct||0)/need*100)):0,rows=s.leaderboard||[],rankLabel=rankingVisible?(window.LGCI18N?LGCI18N.t('roulette.ranking.hide',{},'OCULTAR RANKING'):'OCULTAR RANKING'):(window.LGCI18N?LGCI18N.t('roulette.ranking.show',{},'VER RANKING DA ROLETA'):'VER RANKING DA ROLETA');const badgeBlock=camp===0?'':`<div class="badgeGoal"><strong>${s.achievement_earned?'✓ Badge conquistada: '+esc(s.achievement?.name||'—'):'Próxima badge: '+esc(s.achievement?.name||'—')}</strong><span>${s.achievement_earned?'Compliance Day 2026 · registrada na sua jornada.':`Faltam ${s.correct_remaining} acerto(s) · ${s.correct}/${need}`}</span><div class="goalBar"><span style="width:${s.achievement_earned?100:progress}%"></span></div></div>`;document.getElementById('summary').innerHTML=`<div class="stats"><div class="stat"><strong>${s.correct}</strong><span>acertos</span></div><div class="stat"><strong>${s.answered}</strong><span>rodadas</span></div><div class="stat"><strong>${s.best_streak}</strong><span>melhor sequência</span></div></div>${badgeBlock}<button class="rankToggle" aria-expanded="${rankingVisible?'true':'false'}" onclick="toggleRanking()">${rankLabel}</button><div class="leader ${rankingVisible?'':'hidden'}"><strong>TOP 3 · ACERTOS NA ROLETA</strong>${rows.length?rows.map((r,i)=>`<div class="leaderRow"><span class="leaderPos">${i+1}</span><span>${esc(r.identity)}</span><b>${r.correct} acertos</b></div>`).join(''):'<div class="muted" style="margin-top:8px">Ainda não há resultados.</div>'}<small class="muted">Identidades anonimizadas.</small></div>`}
function toggleRanking(){rankingVisible=!rankingVisible;const current=window.__lastCampSummary;if(current)renderSummary(current)}

let spinning=false;
async function spin(animate=true){
 if(spinning)return;
 spinning=true;
 const b=document.getElementById('spinBtn'),wheel=document.getElementById('wheel');
 b.disabled=true;b.setAttribute('aria-busy','true');
 const challenge=document.getElementById('challenge');
 challenge.innerHTML='<p class="muted" role="status"></p>';
 challenge.firstElementChild.textContent=window.LGCI18N?LGCI18N.translate('Carregando desafio...'):'Carregando desafio...';
 let animation=null;
 try{
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(animate&&!reduceMotion){
   const from=rotation;
   rotation+=1080+Math.floor(Math.random()*360);
   wheel.style.transform=`rotate(${rotation}deg)`;
   wheel.classList.add('is-spinning');
   animation=wheel.animate(
    [{transform:`rotate(${from}deg)`},{transform:`rotate(${rotation}deg)`}],
    {duration:900,easing:'cubic-bezier(.12,.72,.16,1)'}
   );
   // Install rejection handling immediately: cancellation must never leak a rejection.
   animation.finished.catch(()=>{});
  }
  const d=await api('/api/camps/'+camp+'/spin',{method:'POST'});
  spinId=d.spin_id;
  if(d.resumed&&animation)animation.cancel();
  renderSummary(d.summary);
  renderChallenge(d.challenge);
  if(animation)await animation.finished.catch(()=>{});
 }catch(e){
  if(animation)animation.cancel();
  challenge.innerHTML=`<div class="lock">${esc(e.message)}</div>`;
 }finally{
  wheel.classList.remove('is-spinning');
  b.disabled=false;b.removeAttribute('aria-busy');spinning=false;
 }
}

function renderChallenge(c){const el=document.getElementById('challenge');el.innerHTML=`<small style="font-weight:800;color:#a50034">${esc(c.theme).toUpperCase()}</small><h2 id="challengePrompt">${esc(c.prompt)}</h2>${shuffleChoices(c.options).map(o=>`<button type="button" class="option" onclick="answer('${esc(o.id)}')">${esc(o.text)}</button>`).join('')}<div id="result" role="status" aria-live="polite" aria-atomic="true"></div>`;el.setAttribute('aria-labelledby','challengePrompt');requestAnimationFrame(()=>el.querySelector('.option')?.focus())}
async function answer(id){document.querySelectorAll('.option').forEach(x=>x.disabled=true);try{const d=await api('/api/camps/'+camp+'/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({spin_id:spinId,answer:id})});document.getElementById('result').innerHTML=`<div class="result"><strong>${d.correct?'✓ Acertou':'↺ Tente outra rodada'}</strong><br>${esc(d.feedback)}${d.bonus_achievements_unlocked?.length?`<br><strong>Conquista: ${esc(d.bonus_achievements_unlocked.join(', '))}</strong>`:''}<br><small class="muted">${esc(d.note)}</small></div><button class="primary" style="margin-top:10px" onclick="spin()">GIRAR NOVAMENTE</button>`;renderSummary(d.summary);if(window.LGCAchievement)LGCAchievement.show(d.achievements_unlocked||[])}catch(e){alert(e.message)}}load().catch(e=>{const extra=camp===0&&String(e.message).toLowerCase().includes('não encontrado')?'<br><small>Se o M4.3 acabou de ser instalado, reinicie o servidor para carregar a Roleta de Boas-vindas.</small>':'';document.getElementById('challenge').innerHTML=`<div class="lock">${esc(e.message)}${extra}</div>`});
</script><script src="/assets/visual-fixes-round2.js" defer></script><script src="/assets/visual-fixes-round3.js" defer></script><script src="/assets/visual-governance.js" defer></script><script src="/assets/ui-contrast-alignment-fix.js?v=20260911d" defer></script><script src="/assets/consolidated-stage1-camp-fix.js?v=20260915b" defer></script><script src="assets/accessibility.js?v=20260923a" defer></script></body></html>
