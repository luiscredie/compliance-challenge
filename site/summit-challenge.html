<!doctype html><html lang="pt-BR"><head><script src="config.js"></script><script src="assets/cloud.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desafio Coletivo do Cume · LG Compliance Challenge</title><style>:root{--navy:#061d32;--gold:#e1bc63;--wine:#a50034;--paper:#fff9e9;--green:#2f725f}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#315a74,#061d32 58%);color:#fff;min-height:100vh}.shell{max-width:1120px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center}.ghost{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:10px;padding:10px 13px;font-weight:700}.layout{display:grid;grid-template-columns:1fr 360px;gap:16px}.card{background:linear-gradient(145deg,#fffdf5,#f2dfad);color:#28231c;border:1px solid #c99d42;border-radius:18px;padding:20px;box-shadow:0 18px 45px rgba(0,0,0,.22)}.risk{height:18px;background:#d9ccb0;border-radius:999px;overflow:hidden}.risk span{height:100%;display:block;background:linear-gradient(90deg,#2f725f,#dfb84e);transition:width .5s}.option{width:100%;display:block;margin:8px 0;padding:13px;text-align:left;border:1px solid #d6bd84;background:#fff;border-radius:10px}.option:hover{border-color:#a50034}.primary{border:0;background:#a50034;color:#fff;padding:12px 16px;border-radius:10px;font-weight:800}.result{padding:12px;background:#fff;border-left:5px solid #a50034;border-radius:9px;margin-top:12px;line-height:1.45}.site{display:grid;grid-template-columns:40px 1fr 70px;gap:8px;padding:9px;border-bottom:1px solid #d8c69f;align-items:center}.pos{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#efe0b7;font-weight:800}.muted{color:#695e4c}.lock{padding:14px;border:1px dashed #a50034;background:#fff4f6;border-radius:10px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.kpi{background:#fff;padding:9px;text-align:center;border-radius:9px}.kpi strong{display:block;font-size:21px}@media(max-width:830px){.layout{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start}.shell{padding:14px}.card{padding:16px}.kpis{grid-template-columns:1fr 1fr 1fr}}@media(max-width:480px){.kpis{grid-template-columns:1fr}.site{grid-template-columns:34px 1fr 58px}.head h1{font-size:30px}}</style><link rel="stylesheet" href="/assets/achievement-toast.css"><link rel="stylesheet" href="/assets/i18n.css"><script src="/assets/i18n.js"></script><link rel="stylesheet" href="/assets/design-system.css"><link rel="stylesheet" href="/assets/roraima-all-slides.css?v=20260911b"><link rel="stylesheet" href="assets/visual-review.css"><script src="assets/visual-review.js" defer></script></head><body><main class="shell"><header class="head"><div><small style="color:#f3d173;font-weight:800">ATIVIDADE EXTRA · CUME COLETIVO</small><h1>Desafio Coletivo do Cume</h1><div style="color:rgba(255,255,255,.75)">As unidades competem em desempenho e, juntas, reduzem o risco coletivo.</div></div><button class="ghost" onclick="returnJourney()">← Jornada</button></header><div class="layout" style="margin-top:18px"><section class="card"><div id="play"></div></section><aside class="card"><h2>Expedição coletiva</h2><div id="aggregate"></div></aside></div></main><script src="/assets/achievement-toast.js"></script><script>
const token=sessionStorage.getItem('lgpt');if(!token)location.href='/';function returnJourney(){sessionStorage.setItem('lgInternalReturn','1');location.href='/'}const H=()=>({'Authorization':'Bearer '+token});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...H(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok){const msg=d.detail||'Erro';throw new Error(window.LGCI18N?LGCI18N.translate(msg):msg)}return d}let state=null,startedAt=0;
async function load(){state=await api('/api/summit-common');renderAggregate(state.aggregate);renderState()}
function renderAggregate(a){const coop=a.cooperation||{},sites=a.competition?.sites||[];document.getElementById('aggregate').innerHTML=`<div><strong>Risco restante: ${coop.risk_remaining}%</strong><div class="risk"><span style="width:${100-(coop.risk_remaining||0)}%"></span></div><small class="muted">${esc(coop.status)} · meta coletiva ${a.correct}/${a.target_correct} acertos</small></div><div class="kpis"><div class="kpi"><strong>${a.eligible}</strong><span>elegíveis</span></div><div class="kpi"><strong>${a.started}</strong><span>iniciaram</span></div><div class="kpi"><strong>${a.completed}</strong><span>concluíram</span></div></div><h3>Unidades</h3>${sites.length?sites.map((s,i)=>`<div class="site"><span class="pos">${i+1}</span><span><strong>${esc(s.site)}</strong><br><small class="muted">${Math.round(s.accuracy*100)}% precisão · ${Math.round(s.participation*100)}% participação</small></span><strong>${s.team_score.toFixed(1)}</strong></div>`).join(''):'<div class="muted">Ainda não há respostas.</div>'}`}
function renderState(){const p=document.getElementById('play');if(!state.open){p.innerHTML='<div class="lock"><strong>Desafio ainda fechado.</strong><br>O Admin abrirá esta atividade quando chegar a hora do Cume.</div>';return}if(!state.eligible){p.innerHTML='<div class="lock"><strong>Complete a escalada primeiro.</strong><br>O Desafio Coletivo do Cume é liberado depois das três etapas.</div>';return}if(!state.attempt){p.innerHTML='<h2>Pronto para ajudar sua unidade e a expedição inteira?</h2><p class="muted">São 8 rodadas comuns. O resultado não altera seu score individual de 50.235 pontos.</p><button class="primary" onclick="start()">INICIAR DESAFIO COLETIVO</button>';return}if(state.attempt.status==='completed'){const a=state.achievement||{},when=a.earned_at&&window.LGCAchievement?LGCAchievement.formatDate(a.earned_at,a.timestamp_approximate):'';if(a.name&&window.LGCAchievement)LGCAchievement.show([a],{once:true});p.innerHTML=`<div style="text-align:center">${a.asset?`<img src="/assets/badges/${esc(a.asset)}" alt="Badge Cume em Equipe" style="width:132px;height:132px;object-fit:contain">`:''}<h2>Cume em Equipe ✓</h2><p>Você concluiu ${state.attempt.total_rounds}/${state.attempt.total_rounds} rodadas comuns com <strong>${state.attempt.correct} acertos</strong>.</p>${a.event?`<p class="muted"><strong>${esc(a.event)}</strong>${when?' · '+esc(when):''}</p>`:''}<p class="muted">Seu resultado já está incorporado à cooperação global e ao desempenho da sua unidade.</p><button class="primary" onclick="refresh()">ATUALIZAR RESULTADO COLETIVO</button></div>`;return}loadRound(state.attempt.answered+1)}
async function start(){const d=await api('/api/summit-common/start',{method:'POST'});state.attempt=d.attempt;renderAggregate(d.aggregate);renderState()}
async function loadRound(n){try{const d=await api('/api/summit-common/round/'+n);startedAt=Date.now();const r=d.round;document.getElementById('play').innerHTML=`<small style="font-weight:800;color:#a50034">RODADA ${r.round}/${d.attempt.total_rounds} · ${esc(r.theme)}</small><h2>${esc(r.prompt)}</h2>${r.options.map(o=>`<button class="option" onclick="answer(${r.round},'${esc(o.id)}')">${esc(o.text)}</button>`).join('')}<div id="feedback"></div>`}catch(e){document.getElementById('play').innerHTML=`<div class="lock">${esc(e.message)}</div>`}}
async function answer(n,id){document.querySelectorAll('.option').forEach(x=>x.disabled=true);try{const d=await api('/api/summit-common/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({attempt_id:state.attempt.attempt_id,round:n,answer:id,elapsed_ms:Date.now()-startedAt})});state.attempt=d.attempt;renderAggregate(d.aggregate);if(window.LGCAchievement)LGCAchievement.show(d.achievements_unlocked||[]);document.getElementById('feedback').innerHTML=`<div class="result"><strong>${d.result.correct?'✓ Resposta correta':'Resposta registrada'}</strong><br>${esc(d.feedback)}<br><small class="muted">${esc(d.note)}</small></div>${state.attempt.status==='completed'?'<button class="primary" style="margin-top:10px" onclick="finish()">VER RESULTADO</button>':'<button class="primary" style="margin-top:10px" onclick="loadRound('+(n+1)+')">PRÓXIMA RODADA</button>'}`}catch(e){alert(e.message)}}
async function finish(){state=await api('/api/summit-common');renderAggregate(state.aggregate);renderState()}async function refresh(){state=await api('/api/summit-common');renderAggregate(state.aggregate);renderState()}load().catch(e=>document.getElementById('play').innerHTML=`<div class="lock">${esc(e.message)}</div>`);
</script><script src="/assets/p0-design-governance.js" defer></script><script src="/assets/p1-editorial-normalization.js" defer></script><script src="/assets/p2-performance.js" defer></script><script src="/assets/roraima-all-slides.js?v=20260911b" defer></script></body></html>
